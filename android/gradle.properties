org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler cannot close its page-cache storage when the
# project path contains a space ("E:\Real Projects\..."), which fails the build
# with "Could not close incremental caches". Full recompilation is slightly
# slower and correct; drop this line if the project is ever moved to a
# space-free path.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
